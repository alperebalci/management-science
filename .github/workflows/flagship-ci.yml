name: Native flagship decision-model CI

on:
  push:
    branches: [main]
    paths:
      - "case-studies/flagships/decision-analysis-capacity-expansion/**"
      - "case-studies/flagships/decision-science-preferences-and-information/**"
      - "case-studies/flagships/revenue-management-booking-limits/**"
      - "tests/**"
      - ".github/workflows/flagship-ci.yml"
  pull_request:
    paths:
      - "case-studies/flagships/decision-analysis-capacity-expansion/**"
      - "case-studies/flagships/revenue-management-booking-limits/**"
      - "tests/**"
      - ".github/workflows/flagship-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install mathematical model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2" "scipy>=1.12,<2" "pytest>=8,<10"
          python -m pip check
      - name: Compile flagship cases
        run: |
          python -m compileall -q case-studies/flagships/decision-analysis-capacity-expansion case-studies/flagships/revenue-management-booking-limits tests
      - name: Validate real decision-model invariants
        run: python -m pytest -q tests/test_flagship_decisions.py tests/test_decision_science.py
